# 定位由外部提供: fastlio2 发布 odom->base_link, localizer 发布 map->odom, 不使用 AMCL
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /fastlio2/lio_odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "/home/robomaster/project/rm_gazebo_26/rm_control_26/install/sentry_nav2_bringup/share/sentry_nav2_bringup/behavior_trees/navigate_to_pose_w_collision_recovery.xml"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    # 注意: Jazzy 的 bt_navigator 默认已注册全套 BT 节点, 显式提供 plugin_lib_names
    # 会因节点 ID 重复注册而 FATAL (ID [ComputePathToPose] already registered), 故不设置

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    # 当前速度来自 fastlio2 里程计; controller_server 默认订阅 /odom, 必须显式指定
    odom_topic: /fastlio2/lio_odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 近障低速绕行时避免过早判定无进展，同时仍能触发下面的恢复行为树。
      required_movement_radius: 0.20
      movement_time_allowance: 15.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      # 到达判定: 位姿容差 + 实际速度必须低于阈值, 防止未停稳就上报到达
      plugin: "nav2_controller::StoppedGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      # 到达目标点允许的最大线速度/角速度 (m/s, rad/s)
      trans_stopped_velocity: 0.05
      rot_stopped_velocity: 0.15
    # HERO MPC 控制器订阅 MINCO 平滑器发布的时间参数化多项式轨迹。
    FollowPath:
      plugin: "hero_mpc_controller::HeroMpcController"
      trajectory_timeout: 1.0
      max_velocity: 0.52
      max_omega: 1.0
      max_acceleration: 2.0
      max_alpha: 3.2
      enable_yaw_tracking: true
      reference_yaw: 0.0
      transform_tolerance: 2.0
      weight_q: [400.0, 400.0, 100.0, 10.0, 10.0, 10.0]
      weight_r: [1.0, 1.0, 0.5]
      carrot_point_index: 5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      # TF 查询容忍(map→odom 峰值滞后 0.7s, 慢仿真实测), 默认 0.3 会 "Transform data too old"
      # map→odom 数值两次配准间不变, 放宽到 2.0s 覆盖 localizer 1Hz align 阻塞停滞, 无精度损失
      transform_tolerance: 2.0
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.02
      robot_radius: 0.36
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        # 传感器原点 z≈0(base_link 初始高度), origin_z 从 0 改为 -0.2,
        # 避免 sensor origin 恰在体素层 z 下边界被拒(out of map bounds, 无法 raytrace)。
        origin_z: -0.2
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # 同 local_costmap: 容忍 map→odom 配准链的 stamp 滞后
      transform_tolerance: 2.0
      use_sim_time: True
      robot_radius: 0.36
      resolution: 0.02
      track_unknown_space: true
      # 全局规划只使用已经保存的静态地图。动态激光仅进入滚动局部代价地图，
      # 避免定位短时误差或车体回波在全局地图中留下残留障碍。
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      # RViz 的 costmap 显示只能处理全量消息, 必须为 True
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["minco_smoother"]
    minco_smoother:
      plugin: "pb_minco/MincoSmoother"
      weight_smooth: 1.0
      weight_obstacle: 100.0
      weight_feasibility: 10.0
      weight_time: 10.0
      max_vel: 0.52
      max_acc: 2.0
      safe_distance: 0.45
      max_iterations: 200
      g_epsilon: 0.0001
      integral_resolution: 8
      min_waypoints: 3
      max_waypoints: 50
      resample_time_resolution: 1.0
      rotation_penalty_weight: 0.5
      dense_sample_resolution: 0.10
      output_dt: 0.05
      publish_trajectory: true
      odom_topic: /fastlio2/lio_odom
      trajectory_continuity_threshold: 0.25
      projection_search_resolution: 0.02

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    # map→odom 由 localizer 1Hz 配准更新, stamp 平均落后 odom 链 0.19s(峰值 0.7s, 慢仿真实测);
    # 该变换两次配准间数值不变, 放宽 tolerance 无精度损失, 否则 "Transform data too old" abort
    transform_tolerance: 2.0
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.6, 1.0]
    min_velocity: [-0.6, -0.6, -1.0]
    max_accel: [1.5, 1.5, 2.0]
    max_decel: [-1.5, -1.5, -2.0]
    odom_topic: "/fastlio2/lio_odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Jazzy navigation_launch.py 的 lifecycle_manager 托管 collision_monitor,
# 缺少本节会导致其 configure 失败并中止整个导航栈 bringup (bt_navigator 无法激活)
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    # 速度链路: controller -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed -> 本节点 -> /cmd_vel
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 2.0
    source_timeout: 5.0
    base_shift_correction: False
    polygons: ["VelocityPolygonStop", "PolygonSlow"]
    # 停车区随运动方向切换。前进时保留前方安全距离，倒车恢复时缩短后方
    # 停车区，避免原先对称 PolygonStop 把 BackUp 恢复速度截断。
    VelocityPolygonStop:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 4
      visualize: False
      polygon_pub_topic: "velocity_polygon_stop"
      velocity_polygons: ["rotation", "translation_forward", "translation_backward", "stopped"]
      holonomic: false
      rotation:
        points: "[[0.43, 0.43], [0.43, -0.43], [-0.43, -0.43], [-0.43, 0.43]]"
        linear_min: 0.0
        linear_max: 0.05
        theta_min: -1.0
        theta_max: 1.0
      translation_forward:
        points: "[[0.48, 0.43], [0.48, -0.43], [-0.38, -0.43], [-0.38, 0.43]]"
        linear_min: 0.0
        linear_max: 1.0
        theta_min: -1.0
        theta_max: 1.0
      translation_backward:
        points: "[[0.38, 0.43], [0.38, -0.43], [-0.41, -0.43], [-0.41, 0.43]]"
        linear_min: -1.0
        linear_max: 0.0
        theta_min: -1.0
        theta_max: 1.0
      stopped:
        points: "[[0.43, 0.43], [0.43, -0.43], [-0.43, -0.43], [-0.43, 0.43]]"
        linear_min: -1.0
        linear_max: 1.0
        theta_min: -1.0
        theta_max: 1.0
    PolygonSlow:
      type: "polygon"
      points: "[[0.75, 0.75], [-0.75, 0.75], [-0.75, -0.75], [0.75, -0.75]]"
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.3
      visualize: False
      polygon_pub_topic: "polygon_slowdown"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.05
      max_height: 1.2

# Jazzy navigation_launch.py 的 lifecycle_manager 同样托管 docking_server,
# 缺少 dock_plugins 会导致 configure 失败并中止 bringup (配置取自 nav2_bringup 官方默认值)
docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
