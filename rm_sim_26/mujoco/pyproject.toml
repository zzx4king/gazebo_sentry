[project]
name = "sentry-mj"
version = "0.1.0"
description = "MuJoCo simulation of the 26-season sentry, for physics and gimbal system identification"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
mesh = [
    "trimesh>=4.0",
]

[project.scripts]
sentry-mj = "sentry_mj.viewer:main"
sentry-mj-id = "sentry_mj.identify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentry_mj"]

[tool.ruff]
line-length = 100
